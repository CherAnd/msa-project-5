apiVersion: batch/v1
kind: CronJob
metadata:
  name: export
spec:
  schedule: "0 20 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: exporter
              image: exporter:latest
              imagePullPolicy: Never
              envFrom:
                - configMapRef:
                    name: export-config
                - secretRef:
                    name: postgres-secret
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
